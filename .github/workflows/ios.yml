name: iOS

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail

          destination="$(ruby <<'RUBY'
          require "json"

          devices = JSON.parse(`xcrun simctl list devices available -j`).fetch("devices").values.flatten
          iphones = devices.select do |device|
            device["isAvailable"] && device["name"].start_with?("iPhone")
          end

          selected = iphones.find { |device| device["name"] == "iPhone 17" } || iphones.first
          puts selected ? "platform=iOS Simulator,id=#{selected.fetch("udid")}" : ""
          RUBY
          )"

          if [ -z "$destination" ]; then
            udid="$(ruby <<'RUBY'
          require "json"

          runtimes = JSON.parse(`xcrun simctl list runtimes -j`).fetch("runtimes")
          runtime = runtimes
            .select { |item| item["platform"] == "iOS" && item["isAvailable"] }
            .max_by { |item| item.fetch("version").split(".").map(&:to_i) }
          abort "No available iOS simulator runtime" unless runtime

          device_type = runtime.fetch("supportedDeviceTypes")
            .find { |item| item["productFamily"] == "iPhone" && item["name"] == "iPhone 17" } ||
            runtime.fetch("supportedDeviceTypes")
              .find { |item| item["productFamily"] == "iPhone" && item["name"].include?("Pro") } ||
            runtime.fetch("supportedDeviceTypes")
              .find { |item| item["productFamily"] == "iPhone" }
          abort "No available iPhone simulator device type" unless device_type

          print `xcrun simctl create "CI iPhone" "#{device_type.fetch("identifier")}" "#{runtime.fetch("identifier")}"`.strip
          RUBY
          )"
            destination="platform=iOS Simulator,id=$udid"
          fi

          echo "IOS_SIMULATOR_DESTINATION=$destination" >> "$GITHUB_ENV"
          echo "Using $destination"

      - name: Build and test
        run: |
          xcodebuild \
            -project apps/ios/CalculetteFiscale.xcodeproj \
            -scheme CalculetteFiscale \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            test
